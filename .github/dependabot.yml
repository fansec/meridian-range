# Dependabot for Meridian Range.
#
# ⛔ READ THIS BEFORE ADDING AN ECOSYSTEM. Two dependencies in this repo are pinned to KNOWN-VULNERABLE
#    releases on purpose: they are the subject under study, not an oversight. Merging a bump for either
#    one silently destroys the module that depends on it, and the failure is quiet, because the scenario
#    keeps running and simply stops reproducing. Both are ignored below. If you add a new
#    intentionally-vulnerable pin, add its ignore rule in the same commit.
version: 2

updates:
  # ── Maven: module 01's victim server ────────────────────────────────────────────────────────────
  # servers/mcp-ci-java pins io.modelcontextprotocol.sdk 1.0.0, the release affected by CVE-2026-34237
  # (hardcoded Access-Control-Allow-Origin:* plus session id disclosed on the SSE endpoint event).
  # Patched in 0.18.3 / 1.0.1 / 1.1.1, which is exactly why it must stay where it is. The repo builds
  # the patched 1.0.1 separately via the MCP_SDK_VERSION build arg for the vulnerable-vs-fixed
  # comparison, so nothing is lost by freezing the default.
  - package-ecosystem: maven
    directory: /servers/mcp-ci-java
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "io.modelcontextprotocol.sdk:*"

  # ── npm: module 02's victim server ──────────────────────────────────────────────────────────────
  # servers/ts-vuln depends on @modelcontextprotocol/sdk for its DNS-rebind-protection-off default
  # (CVE-2025-66414 class). Leave it pinned.
  - package-ecosystem: npm
    directory: /servers/ts-vuln
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@modelcontextprotocol/sdk"

  # ── npm: everything that is ordinary tooling and SHOULD stay current ────────────────────────────
  - package-ecosystem: npm
    directory: /                          # eslint + prettier
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /engine/harness            # the scenario runner
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /engine/attacker/collector # the exfil sink
    schedule:
      interval: monthly

  # ── GitHub Actions ──────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
