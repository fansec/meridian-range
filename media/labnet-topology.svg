<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Meridian Range labnet topology">
  <title>Meridian Range - labnet topology</title>

  <!-- self-contained light card so it reads on light or dark README backgrounds -->
  <rect x="0" y="0" width="880" height="560" rx="14" fill="#f6f8fa"/>
  <rect x="0.5" y="0.5" width="879" height="559" rx="14" fill="none" stroke="#d0d7de"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>

  <text x="32" y="40" font-size="20" font-weight="700" fill="#1f2328">Meridian Range</text>
  <text x="32" y="60" font-size="13" fill="#57606a">labnet topology (attack 01: CORS session hijack)</text>

  <!-- victim browser, OUTSIDE the isolated boundary -->
  <rect x="32" y="150" width="176" height="70" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="120" y="180" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Developer browser</text>
  <text x="120" y="200" font-size="11" fill="#57606a" text-anchor="middle">the victim (opens a link)</text>

  <!-- isolated VM / labnet boundary -->
  <rect x="248" y="86" width="600" height="446" rx="14" fill="none" stroke="#8250df" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="268" y="112" font-size="12.5" font-weight="600" fill="#6639ba">isolated VM  .  labnet 172.28.0.0/16</text>
  <text x="268" y="130" font-size="11" fill="#8250df">internal: true  .  no egress  .  no published ports</text>

  <!-- attacker-web -->
  <rect x="278" y="164" width="180" height="72" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="368" y="192" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">attacker-web</text>
  <text x="368" y="211" font-size="11" fill="#57606a" text-anchor="middle">attacker.lab.consulereit.nl</text>
  <text x="368" y="226" font-size="11" fill="#57606a" text-anchor="middle">drive-by page (sealed)</text>

  <!-- mcp-ci: insecure by design -->
  <rect x="544" y="150" width="278" height="100" rx="10" fill="#fff5f5" stroke="#cf222e" stroke-width="1.5"/>
  <text x="683" y="178" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">mcp-ci  (Meridian CI · mcp-core 1.0.0)</text>
  <text x="683" y="198" font-size="11" fill="#cf222e" text-anchor="middle" font-weight="600">INSECURE BY DESIGN</text>
  <text x="683" y="214" font-size="11" fill="#57606a" text-anchor="middle">wildcard CORS + disclosed session id</text>
  <text x="683" y="230" font-size="11" fill="#57606a" text-anchor="middle">capability tool: run_command</text>

  <!-- harness -->
  <rect x="278" y="330" width="180" height="72" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="368" y="360" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">harness</text>
  <text x="368" y="379" font-size="11" fill="#57606a" text-anchor="middle">scenario runner</text>
  <text x="368" y="394" font-size="11" fill="#57606a" text-anchor="middle">(docker compose run)</text>

  <!-- attacker-collector -->
  <rect x="544" y="330" width="200" height="72" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="644" y="360" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">attacker-collector</text>
  <text x="644" y="379" font-size="11" fill="#57606a" text-anchor="middle">exfil sink</text>
  <text x="644" y="394" font-size="11" fill="#57606a" text-anchor="middle">benign canary only</text>

  <!-- browser victim (opt-in) -->
  <rect x="544" y="440" width="278" height="66" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="683" y="468" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">browser  (opt-in demo)</text>
  <text x="683" y="488" font-size="11" fill="#57606a" text-anchor="middle">headless Chromium victim (--profile browser)</text>

  <!-- flows -->
  <!-- browser opens the attacker link (crosses the boundary) -->
  <line x1="208" y1="188" x2="276" y2="196" stroke="#6e7781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="242" y="176" font-size="10" fill="#57606a" text-anchor="middle">opens link</text>

  <!-- attacker-web hijacks mcp-ci cross-origin -->
  <line x1="458" y1="198" x2="542" y2="198" stroke="#cf222e" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <text x="500" y="188" font-size="10" fill="#cf222e" text-anchor="middle">CORS hijack</text>

  <!-- mcp-ci leaks canary to collector -->
  <line x1="660" y1="250" x2="650" y2="328" stroke="#cf222e" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <text x="700" y="292" font-size="10" fill="#cf222e" text-anchor="middle">canary exfil</text>

  <!-- harness reproduces against mcp-ci -->
  <line x1="458" y1="352" x2="588" y2="252" stroke="#6e7781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="512" y="318" font-size="10" fill="#57606a" text-anchor="middle">reproduce</text>

  <!-- legend -->
  <rect x="32" y="300" width="176" height="150" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="48" y="324" font-size="11.5" font-weight="700" fill="#1f2328">Legend</text>
  <rect x="48" y="336" width="14" height="12" rx="3" fill="#fff5f5" stroke="#cf222e"/>
  <text x="70" y="346" font-size="10.5" fill="#57606a">insecure by design</text>
  <line x1="48" y1="364" x2="70" y2="364" stroke="#cf222e" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <text x="78" y="368" font-size="10.5" fill="#57606a">attack path</text>
  <line x1="48" y1="384" x2="70" y2="384" stroke="#6e7781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="78" y="388" font-size="10.5" fill="#57606a">lab / repro path</text>
  <rect x="48" y="400" width="14" height="12" rx="3" fill="none" stroke="#8250df" stroke-dasharray="3 2"/>
  <text x="70" y="410" font-size="10.5" fill="#57606a">no egress boundary</text>
  <text x="48" y="434" font-size="10" fill="#8250df">runs only on the lab VM</text>
</svg>
