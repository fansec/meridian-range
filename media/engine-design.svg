<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 710" width="980" height="710" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Meridian Range: how an attack module is built, how it is run, and what the range contains today">
  <title>Meridian Range - how a module is built, how it runs, what is present</title>

  <!-- self-contained light card, so the figure reads on a light or a dark README background -->
  <rect x="0" y="0" width="980" height="710" rx="16" fill="#f6f8fa"/>
  <rect x="0.5" y="0.5" width="979" height="709" rx="16" fill="none" stroke="#d0d7de"/>

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
  </defs>

  <!-- ============================ header ============================ -->
  <text x="32" y="44" font-size="21" font-weight="700" fill="#1f2328">Meridian Range</text>
  <text x="212" y="44" font-size="13" fill="#57606a">how an attack module is built, how it is run, and what is in the range today</text>
  <rect x="836" y="28" width="112" height="20" rx="10" fill="#fff0f0" stroke="#cf222e"/>
  <text x="892" y="42" font-size="10" font-weight="700" fill="#cf222e" text-anchor="middle">isolated VM only</text>
  <line x1="32" y1="60" x2="948" y2="60" stroke="#d0d7de"/>

  <!-- ==================== 1. AUTHOR: a module is a directory ==================== -->
  <rect x="28" y="84" width="316" height="264" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M28 96 a12 12 0 0 1 12 -12 h292 a12 12 0 0 1 12 12 v18 h-316 z" fill="#f6f8fa"/>
  <line x1="28" y1="114" x2="344" y2="114" stroke="#d0d7de"/>
  <text x="44" y="105" font-size="11.5" font-weight="700" fill="#1f2328">1 . AUTHOR</text>
  <rect x="128" y="92" width="34" height="16" rx="8" fill="#eef2ff" stroke="#8250df"/>
  <text x="145" y="104" font-size="9.5" font-weight="700" fill="#6639ba" text-anchor="middle">dev</text>
  <text x="174" y="105" font-size="10.5" fill="#57606a">an attack is one directory</text>

  <text x="44" y="140" font-size="11.5" font-weight="700" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">modules/01-cors-session-hijack/</text>

  <line x1="48" y1="150" x2="48" y2="308" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <g font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">
    <text x="58" y="166">module.yml</text>
    <text x="58" y="190">scenario.ts</text>
    <text x="58" y="214">compose.yml</text>
    <text x="58" y="238">lab.env</text>
    <text x="58" y="262">detection/</text>
    <text x="58" y="286">evidence/</text>
    <text x="58" y="310">README.md</text>
  </g>
  <g font-size="9.5" fill="#57606a">
    <text x="158" y="166">identity, CVE, OWASP, matrix</text>
    <text x="158" y="190">the attack itself, one per module</text>
    <text x="158" y="214">sealed service, no ports</text>
    <text x="158" y="238">in-lab targets</text>
    <text x="158" y="262">ATR rule and its test cases</text>
    <text x="158" y="286">written by the run, not by hand</text>
    <text x="158" y="310">the writeup</text>
  </g>
  <text x="44" y="334" font-size="9.5" fill="#6e7781">./range new 03 tool-poisoning scaffolds the whole shape</text>

  <!-- discovery arrow -->
  <line x1="346" y1="216" x2="366" y2="216" stroke="#8250df" stroke-width="1.6" marker-end="url(#p)"/>

  <!-- ==================== 2. ENGINE: shared machinery ==================== -->
  <rect x="368" y="84" width="584" height="264" rx="12" fill="#fbfaff" stroke="#8250df" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="386" y="110" font-size="11.5" font-weight="700" fill="#6639ba">2 . ENGINE</text>
  <text x="464" y="110" font-size="10.5" fill="#57606a">shared machinery, identical for every attack, never forked per module</text>
  <text x="386" y="129" font-size="9.5" fill="#6e7781">discovered by globbing modules/*/module.yml, so there is no catalog to edit and no registry to update</text>

  <rect x="386" y="142" width="272" height="94" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="402" y="166" font-size="12.5" font-weight="700" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">./range</text>
  <text x="402" y="187" font-size="9.5" fill="#57606a">one CLI for the whole range</text>
  <text x="402" y="204" font-size="9.5" fill="#57606a">list . check . up . run . verify . probe</text>
  <text x="402" y="221" font-size="9.5" fill="#57606a">matrix . detect-test . export . render . sync</text>

  <rect x="674" y="142" width="262" height="94" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="690" y="166" font-size="12.5" font-weight="700" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">engine/harness</text>
  <text x="690" y="187" font-size="9.5" fill="#57606a">scenario SDK, MCP transport clients</text>
  <text x="690" y="204" font-size="9.5" fill="#57606a">canary, exfil call, evidence writer</text>
  <text x="690" y="221" font-size="9.5" fill="#1a7f37" font-weight="600">contract: ok means the attack landed</text>

  <rect x="386" y="246" width="272" height="86" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="402" y="270" font-size="12.5" font-weight="700" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">engine/compose.yml</text>
  <text x="402" y="291" font-size="9.5" fill="#57606a">the sealed base every module merges onto</text>
  <text x="402" y="308" font-size="9.5" fill="#cf222e" font-weight="600">internal: true, no published ports</text>
  <text x="402" y="325" font-size="9.5" fill="#57606a">exposure is opt-in, per module, in deploy/</text>

  <rect x="674" y="246" width="262" height="86" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="690" y="270" font-size="12.5" font-weight="700" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">servers/ and attacker</text>
  <text x="690" y="291" font-size="9.5" fill="#57606a">the vulnerable servers, each pinned to</text>
  <text x="690" y="308" font-size="9.5" fill="#57606a">the affected SDK release, insecure by design</text>
  <text x="690" y="325" font-size="9.5" fill="#57606a">plus the drive-by page and the exfil sink</text>

  <!-- ==================== 3. RUN THE LOOP ==================== -->
  <text x="32" y="380" font-size="11.5" font-weight="700" fill="#1f2328">3 . RUN THE LOOP</text>
  <text x="150" y="380" font-size="10.5" fill="#57606a">a module counts as done only when both lanes are green on the VM</text>
  <rect x="826" y="366" width="46" height="18" rx="9" fill="#fff0f0" stroke="#cf222e"/>
  <text x="849" y="379" font-size="9.5" font-weight="700" fill="#cf222e" text-anchor="middle">VM</text>
  <rect x="878" y="366" width="70" height="18" rx="9" fill="#eef2ff" stroke="#8250df"/>
  <text x="913" y="379" font-size="9.5" font-weight="700" fill="#6639ba" text-anchor="middle">dev, offline</text>

  <!-- lane 1: reproduce -->
  <rect x="28" y="392" width="188" height="66" rx="10" fill="#fff5f5" stroke="#cf222e" stroke-width="1.3"/>
  <text x="122" y="416" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">range up 01</text>
  <text x="122" y="434" font-size="9.5" fill="#57606a" text-anchor="middle">sealed tier, one module at a</text>
  <text x="122" y="448" font-size="9.5" fill="#57606a" text-anchor="middle">time, no egress, no ports</text>

  <rect x="240" y="392" width="188" height="66" rx="10" fill="#fff5f5" stroke="#cf222e" stroke-width="1.3"/>
  <text x="334" y="416" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">range run 01</text>
  <text x="334" y="434" font-size="9.5" fill="#57606a" text-anchor="middle">the scenario drives the real</text>
  <text x="334" y="448" font-size="9.5" fill="#57606a" text-anchor="middle">attack against a real build</text>

  <rect x="452" y="392" width="188" height="66" rx="10" fill="#cf222e"/>
  <text x="546" y="418" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[ATTACK-OK]</text>
  <text x="546" y="437" font-size="9.5" fill="#ffd9d9" text-anchor="middle">a benign canary really ran,</text>
  <text x="546" y="450" font-size="9.5" fill="#ffd9d9" text-anchor="middle">not merely a request that passed</text>

  <rect x="664" y="392" width="140" height="66" rx="10" fill="#fff5f5" stroke="#cf222e" stroke-width="1.3"/>
  <text x="734" y="416" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">range verify</text>
  <text x="734" y="434" font-size="9.5" fill="#57606a" text-anchor="middle">the gate, and it writes</text>
  <text x="734" y="448" font-size="9.5" fill="#57606a" text-anchor="middle">evidence/vuln.txt</text>

  <rect x="828" y="392" width="124" height="66" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="890" y="416" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">range matrix</text>
  <text x="890" y="434" font-size="9.5" fill="#57606a" text-anchor="middle">every affected and</text>
  <text x="890" y="448" font-size="9.5" fill="#57606a" text-anchor="middle">patched release</text>

  <line x1="218" y1="425" x2="238" y2="425" stroke="#cf222e" stroke-width="1.5" marker-end="url(#r)"/>
  <line x1="430" y1="425" x2="450" y2="425" stroke="#cf222e" stroke-width="1.5" marker-end="url(#r)"/>
  <line x1="642" y1="425" x2="662" y2="425" stroke="#cf222e" stroke-width="1.5" marker-end="url(#r)"/>
  <line x1="806" y1="425" x2="826" y2="425" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#r)"/>

  <!-- lane hop -->
  <line x1="546" y1="460" x2="546" y2="482" stroke="#0969da" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="558" y="476" font-size="10" fill="#0969da" font-weight="600">the run that lands is the run that leaves the signal</text>

  <!-- lane 2: detect -->
  <rect x="28" y="486" width="188" height="66" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
  <text x="122" y="510" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">telemetry</text>
  <text x="122" y="528" font-size="9.5" fill="#57606a" text-anchor="middle">mcp.access in ECS, plus</text>
  <text x="122" y="542" font-size="9.5" fill="#57606a" text-anchor="middle">EDR process events</text>

  <rect x="240" y="486" width="188" height="66" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
  <text x="334" y="510" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">detection/*.yaml</text>
  <text x="334" y="528" font-size="9.5" fill="#57606a" text-anchor="middle">one ATR rule carrying its</text>
  <text x="334" y="542" font-size="9.5" fill="#57606a" text-anchor="middle">own test cases</text>

  <rect x="452" y="486" width="188" height="66" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
  <text x="546" y="510" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">range detect-test</text>
  <text x="546" y="528" font-size="9.5" fill="#57606a" text-anchor="middle">rules run offline as unit</text>
  <text x="546" y="542" font-size="9.5" fill="#57606a" text-anchor="middle">tests, no lab required</text>

  <rect x="664" y="486" width="140" height="66" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
  <text x="734" y="510" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">range export</text>
  <text x="734" y="528" font-size="9.5" fill="#57606a" text-anchor="middle">Sigma or Elastic, to</text>
  <text x="734" y="542" font-size="9.5" fill="#57606a" text-anchor="middle">take to your own SOC</text>

  <rect x="828" y="486" width="124" height="66" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/>
  <text x="890" y="512" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">module done</text>
  <text x="890" y="530" font-size="9.5" fill="#1a7f37" text-anchor="middle">reproduced and</text>
  <text x="890" y="544" font-size="9.5" fill="#1a7f37" text-anchor="middle">detected, VM green</text>

  <line x1="218" y1="519" x2="238" y2="519" stroke="#0969da" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="430" y1="519" x2="450" y2="519" stroke="#0969da" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="642" y1="519" x2="662" y2="519" stroke="#0969da" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="806" y1="519" x2="826" y2="519" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#g)"/>

  <!-- ==================== what is present ==================== -->
  <line x1="32" y1="574" x2="948" y2="574" stroke="#d0d7de"/>
  <text x="32" y="600" font-size="11.5" font-weight="700" fill="#1f2328">IN THE RANGE TODAY</text>
  <text x="182" y="600" font-size="10.5" fill="#57606a">read from the module manifests, never hand-maintained</text>

  <!-- module 01 -->
  <rect x="28" y="612" width="300" height="84" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="44" y="636" font-size="13" font-weight="700" fill="#1f2328">01 . CORS session hijack</text>
  <rect x="252" y="622" width="62" height="18" rx="9" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="283" y="635" font-size="9.5" font-weight="700" fill="#1a7f37" text-anchor="middle">VM green</text>
  <text x="44" y="655" font-size="10" fill="#cf222e" font-weight="600">CVE-2026-34237 (6.1), Java SDK mcp-core 1.0.0</text>
  <text x="44" y="671" font-size="9.5" fill="#57606a">wildcard CORS, session id disclosed on the SSE stream</text>
  <rect x="44" y="678" width="50" height="15" rx="7" fill="#eef2ff" stroke="#8250df"/>
  <text x="69" y="689" font-size="9" font-weight="700" fill="#6639ba" text-anchor="middle">LLM06</text>
  <rect x="100" y="678" width="50" height="15" rx="7" fill="#eef2ff" stroke="#8250df"/>
  <text x="125" y="689" font-size="9" fill="#6639ba" text-anchor="middle">MCP07</text>
  <rect x="156" y="678" width="66" height="15" rx="7" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="189" y="689" font-size="9" fill="#57606a" text-anchor="middle">ATR-70001</text>
  <rect x="228" y="678" width="86" height="15" rx="7" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="271" y="689" font-size="9" fill="#57606a" text-anchor="middle">repro and detect</text>

  <!-- module 02 -->
  <rect x="344" y="612" width="300" height="84" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="360" y="636" font-size="13" font-weight="700" fill="#1f2328">02 . DNS rebinding</text>
  <rect x="568" y="622" width="62" height="18" rx="9" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="599" y="635" font-size="9.5" font-weight="700" fill="#1a7f37" text-anchor="middle">VM green</text>
  <text x="360" y="655" font-size="10" fill="#cf222e" font-weight="600">CVE-2025-66414 (7.6), TypeScript SDK</text>
  <text x="360" y="671" font-size="9.5" fill="#57606a">defeats the Origin check that stops module 01</text>
  <rect x="360" y="678" width="50" height="15" rx="7" fill="#eef2ff" stroke="#8250df"/>
  <text x="385" y="689" font-size="9" font-weight="700" fill="#6639ba" text-anchor="middle">LLM06</text>
  <rect x="416" y="678" width="66" height="15" rx="7" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="449" y="689" font-size="9" fill="#57606a" text-anchor="middle">ATR-70018</text>
  <rect x="488" y="678" width="86" height="15" rx="7" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="531" y="689" font-size="9" fill="#57606a" text-anchor="middle">repro and detect</text>

  <!-- backlog -->
  <rect x="660" y="612" width="292" height="84" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/>
  <text x="676" y="632" font-size="12" font-weight="700" fill="#1f2328">Backlog</text>
  <text x="736" y="632" font-size="9.5" fill="#57606a">catalogued, shipped one at a time</text>
  <g font-size="9.5" fill="#57606a">
    <text x="676" y="652">A  OAuth / DCR token theft, audience confusion</text>
    <text x="676" y="668">B  indirect injection via tool result, rug pull</text>
    <text x="676" y="684">C  cross-tool exfil, SSRF, sandbox escape</text>
  </g>
</svg>
