<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">The Meridian Range workflow</title>
  <desc id="desc">A published MCP flaw is packaged as a module, reproduced with a benign canary inside an isolated lab VM, and turned into a tested detection.</desc>

  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8250df"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0969da"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="429" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>

  <rect x="40" y="28" width="166" height="24" rx="12" fill="#f1eafe" stroke="#8250df"/>
  <text x="123" y="44.5" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#6639ba" text-anchor="middle">THE MERIDIAN LOOP</text>
  <text x="40" y="83" font-size="27" font-weight="750" fill="#1f2328">From published flaw to tested detection</text>
  <text x="40" y="107" font-size="13.5" fill="#57606a">One small workflow, repeated for every attack module.</text>
  <rect x="790" y="72" width="130" height="26" rx="13" fill="#fff1f1" stroke="#cf222e"/>
  <text x="855" y="89.5" font-size="10.5" font-weight="700" fill="#cf222e" text-anchor="middle">ISOLATED VM ONLY</text>

  <rect x="40" y="128" width="250" height="208" rx="14" fill="#ffffff" stroke="#8250df" stroke-width="1.4"/>
  <rect x="40" y="128" width="250" height="7" rx="3.5" fill="#8250df"/>
  <circle cx="68" cy="161" r="15" fill="#f1eafe"/>
  <text x="68" y="166" font-size="13" font-weight="750" fill="#6639ba" text-anchor="middle">1</text>
  <text x="94" y="165" font-size="11" font-weight="700" letter-spacing="0.7" fill="#6639ba">MODULE</text>
  <text x="60" y="207" font-size="18" font-weight="750" fill="#1f2328">Package one attack</text>
  <text x="60" y="235" font-size="12" fill="#57606a">Published CVE + affected SDK</text>
  <text x="60" y="261" font-size="12" fill="#57606a">Scenario + module manifest</text>
  <text x="60" y="287" font-size="12" fill="#57606a">Detection rule + test cases</text>
  <rect x="60" y="303" width="106" height="22" rx="11" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="113" y="318" font-size="10" font-weight="650" fill="#57606a" text-anchor="middle">AUTHORING HOST</text>

  <line x1="302" y1="232" x2="343" y2="232" stroke="#8250df" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="322" y="217" font-size="10" font-weight="650" fill="#6639ba" text-anchor="middle">sync</text>

  <rect x="355" y="128" width="250" height="208" rx="14" fill="#ffffff" stroke="#cf222e" stroke-width="1.4"/>
  <rect x="355" y="128" width="250" height="7" rx="3.5" fill="#cf222e"/>
  <circle cx="383" cy="161" r="15" fill="#fff1f1"/>
  <text x="383" y="166" font-size="13" font-weight="750" fill="#cf222e" text-anchor="middle">2</text>
  <text x="409" y="165" font-size="11" font-weight="700" letter-spacing="0.7" fill="#cf222e">REPRODUCE</text>
  <text x="375" y="207" font-size="18" font-weight="750" fill="#1f2328">Prove the attack lands</text>
  <rect x="375" y="224" width="210" height="38" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="480" y="248" font-size="13" font-weight="650" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">./range run 01</text>
  <rect x="375" y="275" width="112" height="28" rx="14" fill="#cf222e"/>
  <text x="431" y="293.5" font-size="11.5" font-weight="750" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[ATTACK-OK]</text>
  <text x="499" y="286" font-size="10.5" fill="#57606a">benign canary</text>
  <text x="499" y="301" font-size="10.5" fill="#57606a">sealed network</text>
  <rect x="375" y="308" width="92" height="17" rx="8.5" fill="#fff1f1"/>
  <text x="421" y="320" font-size="9.5" font-weight="650" fill="#cf222e" text-anchor="middle">LAB VM</text>
  <text x="477" y="320" font-size="9.5" fill="#6e7781">no egress, no ports</text>

  <line x1="617" y1="232" x2="658" y2="232" stroke="#0969da" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="637" y="217" font-size="10" font-weight="650" fill="#0969da" text-anchor="middle">observe</text>

  <rect x="670" y="128" width="250" height="208" rx="14" fill="#ffffff" stroke="#0969da" stroke-width="1.4"/>
  <rect x="670" y="128" width="250" height="7" rx="3.5" fill="#0969da"/>
  <circle cx="698" cy="161" r="15" fill="#ddf4ff"/>
  <text x="698" y="166" font-size="13" font-weight="750" fill="#0969da" text-anchor="middle">3</text>
  <text x="724" y="165" font-size="11" font-weight="700" letter-spacing="0.7" fill="#0969da">DETECT</text>
  <text x="690" y="207" font-size="18" font-weight="750" fill="#1f2328">Turn traces into signal</text>
  <text x="690" y="235" font-size="12" fill="#57606a">Telemetry + ATR test cases</text>
  <rect x="690" y="249" width="210" height="38" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="795" y="273" font-size="12.5" font-weight="650" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">./range detect-test</text>
  <rect x="690" y="302" width="58" height="23" rx="11.5" fill="#ddf4ff" stroke="#0969da"/>
  <text x="719" y="317.5" font-size="10" font-weight="650" fill="#0969da" text-anchor="middle">Sigma</text>
  <rect x="756" y="302" width="62" height="23" rx="11.5" fill="#ddf4ff" stroke="#0969da"/>
  <text x="787" y="317.5" font-size="10" font-weight="650" fill="#0969da" text-anchor="middle">Elastic</text>
  <rect x="826" y="302" width="74" height="23" rx="11.5" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="863" y="317.5" font-size="10" font-weight="700" fill="#1a7f37" text-anchor="middle">SOC READY</text>

  <rect x="40" y="360" width="880" height="47" rx="12" fill="#dafbe1" stroke="#1a7f37"/>
  <circle cx="67" cy="383.5" r="13" fill="#1a7f37"/>
  <path d="M61 383.5L65 387.5L73.5 379" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="91" y="381" font-size="13.5" font-weight="750" fill="#1a7f37">A module is done when reproduction and detection are both green.</text>
  <text x="91" y="398" font-size="11" fill="#347d49">The exploit is the reproduction. The detection is the deliverable.</text>
</svg>
