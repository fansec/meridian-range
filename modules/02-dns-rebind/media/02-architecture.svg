<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 770" width="980" height="770" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="CVE-2025-66414 architecture and trust boundaries: DNS rebinding past Origin validation">
  <title>CVE-2025-66414 - architecture and trust boundaries</title>

  <rect x="0" y="0" width="980" height="770" rx="16" fill="#f6f8fa"/>
  <rect x="0.5" y="0.5" width="979" height="769" rx="16" fill="none" stroke="#d0d7de"/>

  <defs>
    <marker id="atk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
    <marker id="vic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
  </defs>

  <text x="30" y="46" font-size="20" font-weight="700" fill="#1f2328">DNS rebinding past Origin validation</text>
  <text x="30" y="70" font-size="12.5" fill="#57606a">CVE-2025-66414 (CWE-1188) . MCP TypeScript SDK, streamable-HTTP transport . component architecture and trust boundaries</text>

  <!-- ================= attacker infrastructure ================= -->
  <rect x="28" y="96" width="252" height="482" rx="12" fill="#fff5f5" stroke="#cf222e" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="44" y="122" font-size="12" font-weight="700" fill="#cf222e">Attacker infrastructure</text>

  <rect x="44" y="138" width="220" height="88" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="154" y="162" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">rebind-web</text>
  <text x="154" y="181" font-size="10" fill="#57606a" text-anchor="middle">serves the drive-by page at</text>
  <text x="154" y="197" font-size="10" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rebind.lab.consulereit.nl:8080</text>
  <text x="154" y="214" font-size="10" fill="#57606a" text-anchor="middle">the attacker's own domain</text>

  <rect x="44" y="242" width="220" height="120" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4"/>
  <text x="154" y="266" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">authoritative DNS</text>
  <text x="154" y="284" font-size="10" fill="#57606a" text-anchor="middle">the attacker owns the zone</text>
  <text x="154" y="303" font-size="10" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">A rebind.lab.consulereit.nl</text>
  <text x="154" y="320" font-size="10" fill="#cf222e" text-anchor="middle" font-weight="700">TTL 1 to 5 seconds</text>
  <text x="154" y="338" font-size="10" fill="#cf222e" text-anchor="middle" font-weight="700">answer flips attacker to victim</text>
  <text x="154" y="354" font-size="9.5" fill="#57606a" text-anchor="middle">the flip IS the attack</text>

  <rect x="44" y="378" width="220" height="80" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="154" y="402" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">attacker-collector</text>
  <text x="154" y="421" font-size="10" fill="#57606a" text-anchor="middle">exfil sink</text>
  <text x="154" y="438" font-size="10" fill="#57606a" text-anchor="middle">benign canary only</text>

  <!-- ================= victim browser ================= -->
  <rect x="298" y="96" width="272" height="482" rx="12" fill="#fbfaff" stroke="#8250df" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="314" y="122" font-size="12" font-weight="700" fill="#6639ba">Victim browser . Same-Origin Policy</text>

  <rect x="314" y="138" width="240" height="88" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="434" y="162" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Developer's browser</text>
  <text x="434" y="181" font-size="10" fill="#57606a" text-anchor="middle">one tab, one URL, start to finish</text>
  <text x="434" y="199" font-size="10" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">http://rebind.lab.consulereit.nl:8080</text>
  <text x="434" y="216" font-size="10" fill="#57606a" text-anchor="middle">the origin never changes</text>

  <rect x="314" y="242" width="240" height="216" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.3"/>
  <text x="434" y="266" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">Same-Origin Policy</text>
  <text x="434" y="283" font-size="10.5" fill="#6639ba" text-anchor="middle" font-weight="600">and why it cannot help here</text>
  <text x="330" y="308" font-size="10" fill="#57606a">The page only ever addresses its own</text>
  <text x="330" y="323" font-size="10" fill="#57606a">origin. The Origin it sends is that same</text>
  <text x="330" y="338" font-size="10" fill="#57606a">origin, so no CORS check has anything to do.</text>
  <text x="330" y="362" font-size="10" fill="#57606a">An origin is a NAME. Rebinding changes</text>
  <text x="330" y="377" font-size="10" fill="#57606a">the ADDRESS behind the name, which the</text>
  <text x="330" y="392" font-size="10" fill="#57606a">policy has nothing to say about.</text>
  <rect x="330" y="406" width="208" height="40" rx="8" fill="#fff5f5" stroke="#cf222e"/>
  <text x="434" y="422" font-size="10.5" fill="#cf222e" text-anchor="middle" font-weight="700">same-origin request,</text>
  <text x="434" y="437" font-size="10.5" fill="#cf222e" text-anchor="middle" font-weight="700">foreign Host header</text>

  <!-- ================= developer host ================= -->
  <rect x="588" y="96" width="364" height="482" rx="12" fill="#fff5f5" stroke="#cf222e" stroke-width="1.4"/>
  <text x="604" y="122" font-size="12" font-weight="700" fill="#cf222e">Developer host . "only localhost can reach it"</text>

  <rect x="604" y="138" width="332" height="300" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.3"/>
  <text x="770" y="162" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">buildbot-mcp (Meridian CI)</text>
  <text x="770" y="179" font-size="10" fill="#57606a" text-anchor="middle">Node . @modelcontextprotocol/sdk ^1.12.0</text>

  <rect x="620" y="192" width="300" height="94" rx="9" fill="#fff5f5" stroke="#cf222e" stroke-width="1.3"/>
  <text x="770" y="214" font-size="12" font-weight="700" fill="#cf222e" text-anchor="middle">streamable-HTTP transport</text>
  <text x="770" y="232" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">StreamableHTTPServerTransport</text>
  <text x="770" y="252" font-size="10" fill="#cf222e" text-anchor="middle" font-weight="700">no Host allow-list is in force</text>
  <text x="770" y="268" font-size="9.5" fill="#57606a" text-anchor="middle">enableDnsRebindingProtection is off by</text>
  <text x="770" y="281" font-size="9.5" fill="#57606a" text-anchor="middle">default, exactly as the SDK ships it</text>

  <rect x="620" y="298" width="300" height="56" rx="9" fill="#ffffff" stroke="#d0d7de"/>
  <text x="770" y="320" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">MCP session (JSON-RPC 2.0)</text>
  <text x="770" y="339" font-size="9.5" fill="#57606a" text-anchor="middle">issued to whoever asks, Host unchecked</text>

  <rect x="620" y="366" width="300" height="58" rx="9" fill="#fff5f5" stroke="#cf222e" stroke-width="1.3"/>
  <text x="770" y="388" font-size="12" font-weight="700" fill="#cf222e" text-anchor="middle">run_command (the capability)</text>
  <text x="770" y="407" font-size="9.5" fill="#57606a" text-anchor="middle">ad-hoc build step, ungated</text>

  <rect x="604" y="454" width="332" height="80" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="770" y="478" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">shell execution</text>
  <text x="770" y="498" font-size="9.5" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">node -&gt; /bin/sh -c "id; hostname; echo LAB_CANARY"</text>
  <text x="770" y="516" font-size="9.5" fill="#57606a" text-anchor="middle">benign proof-of-execution only</text>

  <!-- ================= numbered attack path ================= -->
  <!-- 1: browser opens the attacker page -->
  <line x1="312" y1="182" x2="266" y2="182" stroke="#6e7781" stroke-width="1.6" marker-end="url(#vic)"/>
  <circle cx="289" cy="182" r="9" fill="#6e7781"/>
  <text x="289" y="186" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <!-- 2: the DNS answer flips -->
  <line x1="266" y1="302" x2="312" y2="302" stroke="#cf222e" stroke-width="1.6" marker-end="url(#atk)"/>
  <circle cx="289" cy="302" r="9" fill="#cf222e"/>
  <text x="289" y="306" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

  <!-- 3: post-rebind initialize -->
  <line x1="556" y1="228" x2="618" y2="228" stroke="#cf222e" stroke-width="1.8" marker-end="url(#atk)"/>
  <circle cx="587" cy="228" r="9" fill="#cf222e"/>
  <text x="587" y="232" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

  <!-- 4: tools/call over the rebound session -->
  <line x1="556" y1="330" x2="618" y2="330" stroke="#cf222e" stroke-width="1.8" marker-end="url(#atk)"/>
  <circle cx="587" cy="330" r="9" fill="#cf222e"/>
  <text x="587" y="334" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

  <!-- 5: exec -->
  <line x1="770" y1="426" x2="770" y2="452" stroke="#cf222e" stroke-width="1.8" marker-end="url(#atk)"/>
  <circle cx="752" cy="440" r="9" fill="#cf222e"/>
  <text x="752" y="444" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>

  <!-- 6: exfil back to the collector -->
  <path d="M604 512 L 320 512 L 320 424 L 268 424" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#atk)"/>
  <circle cx="452" cy="512" r="9" fill="#cf222e"/>
  <text x="452" y="516" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>

  <!-- ================= attack path legend ================= -->
  <rect x="28" y="596" width="924" height="92" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="620" font-size="12" font-weight="700" fill="#1f2328">Attack path</text>
  <g font-size="10" fill="#57606a">
    <text x="132" y="620"><tspan font-weight="700" fill="#1f2328">1</tspan>  victim opens http://rebind.lab.consulereit.nl:8080, which resolves to the attacker</text>
    <text x="132" y="642"><tspan font-weight="700" fill="#1f2328">2</tspan>  attacker flips the A record to the victim address; the short TTL expires</text>
    <text x="132" y="664"><tspan font-weight="700" fill="#1f2328">3</tspan>  the page's own-origin POST /mcp now lands on the victim: session issued</text>
    <text x="560" y="620"><tspan font-weight="700" fill="#1f2328">4</tspan>  tools/call run_command over the rebound session</text>
    <text x="560" y="642"><tspan font-weight="700" fill="#1f2328">5</tspan>  the victim shells out, benign canary only</text>
    <text x="560" y="664"><tspan font-weight="700" fill="#1f2328">6</tspan>  canary output is exfiltrated to the collector</text>
  </g>

  <!-- ================= footer ================= -->
  <rect x="28" y="700" width="924" height="48" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="722" font-size="10.5" fill="#6639ba" font-weight="700">Runs only on the isolated lab VMs . benign canary only . the live flip needs two hosts, one name, one port</text>
  <text x="46" y="738" font-size="9.5" fill="#57606a">The request that lands is same-origin, so its Origin matches its Host and no cross-origin check fires. The control that holds is a Host allow-list.</text>
  <line x1="716" y1="712" x2="746" y2="712" stroke="#cf222e" stroke-width="1.8" marker-end="url(#atk)"/>
  <text x="754" y="716" font-size="9.5" fill="#57606a">attack path</text>
  <line x1="716" y1="732" x2="746" y2="732" stroke="#6e7781" stroke-width="1.6" marker-end="url(#vic)"/>
  <text x="754" y="736" font-size="9.5" fill="#57606a">victim action</text>
  <rect x="848" y="706" width="12" height="12" rx="3" fill="none" stroke="#8250df" stroke-dasharray="3 2"/>
  <text x="866" y="716" font-size="9.5" fill="#57606a">trust boundary</text>
  <rect x="848" y="726" width="12" height="12" rx="3" fill="#fff5f5" stroke="#cf222e"/>
  <text x="866" y="736" font-size="9.5" fill="#57606a">insecure by design</text>
</svg>
