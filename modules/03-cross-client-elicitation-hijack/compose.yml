# Module 03 sealed services. Never add `ports:` here. The scenario runs only on internal labnet.
services:

  mcp-cross-client:
    build:
      context: .
      dockerfile: servers/mcp-cross-client-ts/Dockerfile
      args:
        MCP_SDK_VERSION: ${MCP_SDK_VERSION:-1.25.3}
    container_name: mcp-cross-client
    environment:
      - PORT=8080
      - MCP_OWNER_ID=${MCP_OWNER_ID:-alice.release-owner}
      - MCP_OWNER_TOKEN=${MCP_OWNER_TOKEN:-lab-token-alice-03}
      - MCP_ATTACKER_ID=${MCP_ATTACKER_ID:-bob.external-client}
      - MCP_ATTACKER_TOKEN=${MCP_ATTACKER_TOKEN:-lab-token-bob-03}
      - LAB_LOG_FILE=/var/log/lab/lab.ndjson
    volumes:
      - lablog:/var/log/lab
    networks:
      labnet:
        ipv4_address: 172.28.0.20
        aliases: [mcp.lab.consulereit.nl]

  harness:
    env_file:
      - ./modules/03-cross-client-elicitation-hijack/lab.env
