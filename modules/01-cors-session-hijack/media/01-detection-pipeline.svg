<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="CVE-2026-34237 detection pipeline">
  <title>CVE-2026-34237 - detection pipeline</title>

  <rect x="0" y="0" width="1020" height="560" rx="14" fill="#f6f8fa"/>
  <rect x="0.5" y="0.5" width="1019" height="559" rx="14" fill="none" stroke="#d0d7de"/>

  <defs>
    <marker id="d_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="d_gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text x="30" y="40" font-size="20" font-weight="700" fill="#1f2328">Detection pipeline - two independent SOC-owned layers</text>
  <text x="30" y="61" font-size="13" fill="#57606a">CVE-2026-34237 . the hijack verdict is DERIVED at ingest, never read from the untrusted application</text>

  <!-- Lane A: app-layer root cause -->
  <text x="30" y="104" font-size="12.5" font-weight="700" fill="#0969da">Layer B - app-layer access telemetry (the root cause)</text>

  <rect x="30" y="116" width="150" height="72" rx="9" fill="#fff5f5" stroke="#cf222e"/>
  <text x="105" y="142" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Meridian CI</text>
  <text x="105" y="160" font-size="10.5" fill="#57606a" text-anchor="middle">vulnerable app</text>
  <text x="105" y="176" font-size="10.5" fill="#cf222e" text-anchor="middle">(untrusted source)</text>

  <rect x="212" y="112" width="196" height="80" rx="9" fill="#ffffff" stroke="#d0d7de"/>
  <text x="310" y="134" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">event.dataset: mcp.access</text>
  <text x="310" y="151" font-size="10" fill="#57606a" text-anchor="middle">RAW ECS record: method, path,</text>
  <text x="310" y="165" font-size="10" fill="#57606a" text-anchor="middle">Origin, Host, sessionId, UA</text>
  <text x="310" y="182" font-size="10" font-weight="600" fill="#cf222e" text-anchor="middle">no verdict field</text>

  <rect x="440" y="108" width="212" height="88" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="546" y="130" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">SOC ingest pipeline</text>
  <text x="546" y="148" font-size="10" fill="#1f2328" text-anchor="middle">derive mcp.cors.cross_origin</text>
  <text x="546" y="163" font-size="10" fill="#1f2328" text-anchor="middle">= (Origin host != Host) ?</text>
  <text x="546" y="180" font-size="10" fill="#57606a" text-anchor="middle">the verdict the app never computed</text>

  <rect x="684" y="112" width="200" height="80" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.3"/>
  <text x="784" y="134" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">ATR-2026-70001</text>
  <text x="784" y="151" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">url.path:/mcp/*</text>
  <text x="784" y="165" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mcp.cors.cross_origin:true</text>
  <text x="784" y="182" font-size="10" fill="#57606a" text-anchor="middle">catches the root cause</text>

  <line x1="180" y1="152" x2="210" y2="152" stroke="#57606a" stroke-width="1.5" marker-end="url(#d_gray)"/>
  <line x1="408" y1="152" x2="438" y2="152" stroke="#0969da" stroke-width="1.7" marker-end="url(#d_blue)"/>
  <line x1="652" y1="152" x2="682" y2="152" stroke="#0969da" stroke-width="1.7" marker-end="url(#d_blue)"/>

  <!-- Lane B: endpoint payload -->
  <text x="30" y="256" font-size="12.5" font-weight="700" fill="#0969da">Layer A - endpoint / EDR telemetry (the payload)</text>

  <rect x="30" y="268" width="150" height="72" rx="9" fill="#ffffff" stroke="#d0d7de"/>
  <text x="105" y="294" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Elastic Defend</text>
  <text x="105" y="312" font-size="10.5" fill="#57606a" text-anchor="middle">EDR on the host</text>
  <text x="105" y="328" font-size="10.5" fill="#1a7f37" text-anchor="middle">(SOC-owned)</text>

  <rect x="212" y="264" width="196" height="80" rx="9" fill="#ffffff" stroke="#d0d7de"/>
  <text x="310" y="286" font-size="10.5" font-weight="600" fill="#1f2328" text-anchor="middle">logs-endpoint.events.process</text>
  <text x="310" y="304" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">java -&gt; /bin/sh -c</text>
  <text x="310" y="318" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"...LAB_CANARY..."</text>
  <text x="310" y="334" font-size="10" fill="#57606a" text-anchor="middle">independent of any web log</text>

  <rect x="684" y="264" width="200" height="80" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.3"/>
  <text x="784" y="286" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">EQL process rule</text>
  <text x="784" y="303" font-size="9.5" fill="#57606a" text-anchor="middle">parent java, child sh,</text>
  <text x="784" y="317" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">command_line like LAB_CANARY</text>
  <text x="784" y="334" font-size="10" fill="#57606a" text-anchor="middle">catches the payload</text>

  <line x1="180" y1="304" x2="210" y2="304" stroke="#57606a" stroke-width="1.5" marker-end="url(#d_gray)"/>
  <line x1="408" y1="304" x2="682" y2="304" stroke="#57606a" stroke-width="1.5" marker-end="url(#d_gray)"/>

  <!-- converge to SIEM -->
  <rect x="838" y="386" width="152" height="96" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
  <text x="914" y="412" font-size="12.5" font-weight="700" fill="#0969da" text-anchor="middle">SOC / SIEM</text>
  <text x="914" y="431" font-size="10" fill="#57606a" text-anchor="middle">alert (high severity)</text>
  <text x="914" y="447" font-size="10" fill="#57606a" text-anchor="middle">scoped to lab host.name</text>
  <text x="914" y="463" font-size="10" fill="#57606a" text-anchor="middle">authored disabled until</text>
  <text x="914" y="477" font-size="10" fill="#57606a" text-anchor="middle">a verified live hit</text>

  <path d="M862 192 C 948 258, 966 330, 932 384" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#d_blue)"/>
  <path d="M862 344 C 900 360, 900 372, 900 384" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#d_blue)"/>

  <!-- key annotation -->
  <rect x="30" y="398" width="620" height="86" rx="10" fill="#fbfbff" stroke="#8250df" stroke-dasharray="6 5"/>
  <text x="46" y="424" font-size="12" font-weight="700" fill="#6639ba">Why derive the verdict SOC-side?</text>
  <text x="46" y="446" font-size="11" fill="#57606a">The SOC does not control the vulnerable application and would not trust a "you are</text>
  <text x="46" y="462" font-size="11" fill="#57606a">being attacked" flag it emitted. The app is only a raw log source; the cross-origin</text>
  <text x="46" y="478" font-size="11" fill="#57606a">judgement is computed at ingest from the Origin and Host headers it cannot forge away.</text>

  <text x="30" y="520" font-size="11" fill="#57606a">Definition of done: reproduce (ATTACK-OK) then detect - both layers fire on the lab run and stay silent on benign local-client traffic (no Origin header).</text>
</svg>
